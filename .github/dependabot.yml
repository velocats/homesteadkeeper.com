# Keeps the deploy workflow's actions current. Five of them had drifted onto
# the deprecated Node 20 runtime before anyone noticed, which is exactly the
# kind of slow drift this is for.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
